name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check
      - run: deno check --config supabase/functions/deno.json supabase/functions/mcp/index.ts supabase/functions/billing-webhook/index.ts supabase/functions/stripe-webhook/index.ts
